packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

overrides:
  '@socket.io/mongo-adapter>mongodb': 7.6.0
  systeminformation: 5.33.16
  zod@<4.6.6: ^4.6.6

allowBuilds:
  esbuild: true
  unrs-resolver: true

audit:
  level: high

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - sharp@0.35.5
  - '@modelcontextprotocol/sdk@1.31.0'
  - zod@4.6.6
  - body-parser@2.4.0
  - multer@2.5.0
  - undici@7.30.1
