packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

audit:
  level: high

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - sharp@0.35.5
  - '@modelcontextprotocol/sdk@1.31.0'
